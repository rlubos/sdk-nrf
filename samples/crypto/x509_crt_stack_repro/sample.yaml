sample:
  name: Mbed TLS X.509 stack reproducer
  description: |
    Minimal reproducer for a crash when parsing an X.509 certificate into a
    stack-allocated mbedtls_x509_crt context with NCS nRF Security enabled.

common:
  build_only: true
  tags:
    - ci_build
  platform_allow:
    - nrf52840dk/nrf52840
    - nrf5340dk/nrf5340/cpuapp
    - nrf54lm20dk/nrf54lm20a/cpuapp
  integration_platforms:
    - nrf52840dk/nrf52840
